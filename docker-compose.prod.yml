# =============================================================================
# Production Environment — Language Institute (ops only)
# Images come from Docker Hub SHA tags built by LanguageInstitute-Compose CI.
# VPS path: /opt/institute
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: institute-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-LanguageInstituteDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - institute-postgres-data-prod:/var/lib/postgresql/data
    networks:
      - institute-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-LanguageInstituteDb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    image: ${DOCKER_USERNAME}/institute-backend:${BACKEND_IMAGE_TAG}
    container_name: institute-backend-prod
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-LanguageInstituteDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: LanguageInstitute
      Jwt__Audience: LanguageInstituteUsers
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-ChangeMe!123}
      Swagger__Enabled: ${Swagger__Enabled:-false}
    volumes:
      - uploads_prod:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - institute-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    image: ${DOCKER_USERNAME}/institute-frontend:${FRONTEND_IMAGE_TAG}
    container_name: institute-frontend-prod
    environment:
      INTERNAL_SERVER_SIDE_API_URL: http://backend:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Language Institute}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - institute-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    container_name: institute-nginx-prod
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    environment:
      TZ: Asia/Tehran
      DOMAIN_NAME: ${DOMAIN_NAME}
      SERVER_IP: ${SERVER_IP}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - uploads_prod:/var/www/uploads:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      certbot_init:
        condition: service_completed_successfully
    networks:
      - institute-network-prod
    restart: unless-stopped

  certbot_init:
    image: certbot/certbot
    container_name: institute-certbot-init
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -d "/etc/letsencrypt/live/$${DOMAIN_NAME}" ]; then
          echo "Certificate already exists"
          exit 0
        fi
        certbot certonly --standalone \
          --preferred-challenges http \
          --email "$${CERTBOT_EMAIL}" \
          --agree-tos --no-eff-email \
          -d "$${DOMAIN_NAME}" -d "www.$${DOMAIN_NAME}" || true
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    networks:
      - institute-network-prod
    restart: "no"

  certbot_renew:
    image: certbot/certbot
    container_name: institute-certbot-renew
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          certbot renew --webroot -w /var/www/certbot || true
          sleep $${RENEW_INTERVAL:-43200}
        done
    environment:
      RENEW_INTERVAL: ${RENEW_INTERVAL:-43200}
    networks:
      - institute-network-prod
    restart: unless-stopped

networks:
  institute-network-prod:
    driver: bridge

volumes:
  institute-postgres-data-prod:
  uploads_prod:
  letsencrypt:
  certbot-webroot:
  nginx-logs:
