# envsubst template: LIVEKIT_DOMAIN. Mounted only by docker-compose.livekit.yml (LIVEKIT_ENABLED=true).
# LiveKit signaling (WebSocket) and its HTTP endpoints. Media (UDP/TCP/TURN) never passes through nginx.

# The join token travels in the WebSocket URL (?access_token=…): log the path without the query string.
log_format livekit_noargs '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name ${LIVEKIT_DOMAIN};
    access_log /var/log/nginx/livekit.access.log livekit_noargs;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ${LIVEKIT_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${LIVEKIT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LIVEKIT_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/livekit.access.log livekit_noargs;

    # Room API (Twirp) is for the backend over the Docker network only.
    location /twirp/ {
        return 404;
    }

    location / {
        # Resolved per request, so nginx (and the main site) still start while the livekit container is down.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $livekit_upstream http://livekit:7880;
        proxy_pass $livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # Signaling sockets live for the whole class.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
